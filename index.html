<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Saber — BMW 7 Series 2026 gallery" />
  <title>Saber | BMW 7 Series 2026</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050505;--card:#0d0d0f;--line:#242428;--text:#f5f5f7;--muted:#99999f}
    body{font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .nav{max-width:1180px;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:20px}
    .brand{font-size:26px;font-weight:800;letter-spacing:2px;direction:ltr}
    .brand span{font-weight:400;color:#aaa}
    .search{width:min(330px,48vw);position:relative}
    .search input{width:100%;height:42px;border:1px solid #2b2b30;border-radius:22px;background:#101012;color:white;padding:0 44px 0 18px;outline:none}
    .search input:focus{border-color:#777}
    .search svg{position:absolute;right:15px;top:12px;width:18px;fill:#aaa}
    main{max-width:1180px;margin:auto;padding:30px 22px 70px}
    .hero{min-height:330px;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;display:flex;align-items:flex-end;background:#090909;margin-bottom:24px}
    .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.7;filter:saturate(.9)}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.08) 70%)}
    .hero-content{position:relative;z-index:1;padding:34px}
    .eyebrow{font-size:12px;letter-spacing:3px;color:#bbb;margin-bottom:9px;direction:ltr}
    h1{font-size:clamp(34px,6vw,68px);line-height:.95;direction:ltr}
    .sub{margin-top:12px;color:#c6c6ca;font-size:15px;direction:ltr}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);cursor:pointer;transition:.25s transform,.25s border-color}
    .card:hover{transform:translateY(-4px);border-color:#555}
    .card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
    .caption{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;direction:ltr}
    .caption b{font-size:14px}.caption span{font-size:12px;color:var(--muted)}
    .empty{display:none;text-align:center;color:#aaa;padding:45px}
    footer{text-align:center;color:#666;font-size:12px;padding:25px;border-top:1px solid var(--line);direction:ltr}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}
    .modal img{max-width:min(1100px,94vw);max-height:88vh;border-radius:14px;box-shadow:0 20px 80px #000}
    .close{position:fixed;top:18px;right:22px;width:44px;height:44px;border-radius:50%;border:1px solid #555;background:#111;color:white;font-size:25px;cursor:pointer}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:280px}.nav{height:64px}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.search{width:180px}.hero-content{padding:24px}.hero{min-height:250px}}
  </style>
</head>
<body>
<header>
  <nav class="nav">
    <div class="brand">Saber <span>/ gallery</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.44 4.44 1.42-1.42-4.44-4.44A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
      <input id="search" type="search" placeholder="Search..." autocomplete="off">
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <img src="bmw-7-2026.svg" alt="BMW 7 Series 2026">
    <div class="hero-content">
      <div class="eyebrow">SABER • AUTOMOTIVE</div>
      <h1>BMW 7 SERIES</h1>
      <p class="sub">2026 • G70 • Luxury Sedan</p>
    </div>
  </section>

  <section class="grid" id="gallery">
    <article class="card" data-name="bmw 7 series 2026 front">
      <img src="bmw-7-2026.svg" alt="BMW 7 Series 2026 front" loading="lazy">
      <div class="caption"><b>BMW 7 Series</b><span>2026</span></div>
    </article>
    <article class="card" data-name="bmw 7 series 2026 luxury">
      <img src="bmw-7-2026.svg" alt="BMW 7 Series 2026 luxury" loading="lazy">
      <div class="caption"><b>Luxury</b><span>G70</span></div>
    </article>
    <article class="card" data-name="bmw 740i 2026">
      <img src="bmw-7-2026.svg" alt="BMW 740i 2026" loading="lazy">
      <div class="caption"><b>740i</b><span>2026</span></div>
    </article>
    <article class="card" data-name="bmw g70 sedan">
      <img src="bmw-7-2026.svg" alt="BMW G70 sedan" loading="lazy">
      <div class="caption"><b>G70 Sedan</b><span>Saber</span></div>
    </article>
    <article class="card" data-name="bmw executive sedan">
      <img src="bmw-7-2026.svg" alt="BMW executive sedan" loading="lazy">
      <div class="caption"><b>Executive</b><span>BMW</span></div>
    </article>
    <article class="card" data-name="saber bmw">
      <img src="bmw-7-2026.svg" alt="Saber BMW" loading="lazy">
      <div class="caption"><b>Saber</b><span>BMW 7</span></div>
    </article>
  </section>
  <div class="empty" id="empty">No results.</div>
</main>

<footer>Saber — BMW 7 Series 2026</footer>

<div class="modal" id="modal" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <img id="modalImg" src="" alt="">
</div>

<script>
  const search=document.getElementById('search');
  const cards=[...document.querySelectorAll('.card')];
  const empty=document.getElementById('empty');
  search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase(); let visible=0;
    cards.forEach(c=>{const show=c.dataset.name.includes(q);c.style.display=show?'block':'none';if(show)visible++;});
    empty.style.display=visible?'none':'block';
  });
  const modal=document.getElementById('modal'), modalImg=document.getElementById('modalImg');
  cards.forEach(c=>c.addEventListener('click',()=>{modalImg.src=c.querySelector('img').src;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}));
  const close=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');modalImg.src=''};
  document.getElementById('close').addEventListener('click',close);
  modal.addEventListener('click',e=>{if(e.target===modal)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>
</body>
</html>
